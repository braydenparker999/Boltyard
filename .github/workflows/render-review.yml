name: Render Crawlworks review stills

on:
  workflow_dispatch:
  push:
    branches: [crawlworks-2.2-review]

permissions:
  contents: read

concurrency:
  group: render-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Ensure virtual display dependencies
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v Xvfb >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          fi
      # Match the Android workflow's complete path list so its cache is reusable.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/bolt-yard/4.4.1
            ~/.local/share/godot/export_templates/4.4.1.stable
          key: godot-4.4.1-native-android-v1
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bolt-yard/native-4.4.1
          key: bolt-native-cpp-4.4.1-profile-refcounted-os-v2
      - name: Build Linux binding and render stills
        run: bash tools/render_review.sh
      - name: Save rendered review and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawlworks-render-review
          path: |
            build/*.png
            build/*.log
            build/*.json
          if-no-files-found: error
          retention-days: 7

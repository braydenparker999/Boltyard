name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: [".github/workflows/preview-runtime.yml", ".github/workflows/preview-display.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install rendered-review dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bolt-yard/4.4.1
            ~/.local/share/godot/export_templates/4.4.1.stable
          key: godot-4.4.1-native-android-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bolt-yard/native-4.4.1
          key: bolt-native-cpp-4.4.1-profile-refcounted-os-v2
      - name: Validate and build native Android APK
        run: bash tools/ci_build.sh
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: bolt-yard-android
          path: |
            build/*.apk
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Save validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bolt-yard-build-logs
          path: |
            build/*.log
            build/*.png
            build/*.json
            build/*.mp4
          if-no-files-found: ignore
